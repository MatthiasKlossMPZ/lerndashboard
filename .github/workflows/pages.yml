      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # oder 22

      - name: Install & Build
        run: |
          npm ci
          npm run build   # falls du einen Build hast

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'   # oder './build' je nach Output-Ordner