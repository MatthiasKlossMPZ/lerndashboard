name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lerndashboard   # <-- das ist der entscheidende Trick

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm                        # jetzt findet er die package-lock.json automatisch

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Move dist to root for Pages
        run: mv dist ../dist                  # ein Verzeichnis höher = Repo-Root

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../dist                         # vom Root aus gesehen

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
