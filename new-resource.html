<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Neue Ressource – LernDashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { 
            --primary: #6b46c1; 
            --card: #ffffff; 
            --bg: #f5f7fa; 
            --shadow: 0 4px 12px rgba(0,0,0,0.1); 
        }
        .dark { 
            --bg: #1a1a1a; 
            --card: #2d2d2d; 
            color: #e0e0e0; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: #333; 
            padding: 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: var(--card); 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: var(--shadow); 
        }
        h2 { 
            color: var(--primary); 
            margin: 0 0 20px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: 700;
        }
        .form-group { 
            margin-bottom: 16px; 
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 14px; 
            color: #444;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 14px; 
            background: #fff;
        }
        textarea { 
            min-height: 100px; 
            resize: vertical; 
        }
        .buttons { 
            display: flex; 
            gap: 12px; 
            justify-content: flex-end; 
            margin-top: 20px; 
        }
        button { 
            padding: 10px 18px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .save { 
            background: var(--primary); 
            color: white; 
        }
        .save:hover { 
            background: #7e5be0; 
            transform: translateY(-1px); 
        }
        .cancel { 
            background: #95a5a6; 
            color: white; 
        }
        .cancel:hover { 
            background: #7f8c8d; 
            transform: translateY(-1px); 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Neue Lernressource hinzufügen</h2>
        
        <div class="form-group">
            <label>Thema *</label>
            <input type="text" id="topic" required placeholder="z.B. Klimawandel">
        </div>
        
        <div class="form-group">
            <label>Fach *</label>
            <select id="subject" required></select>
        </div>
        
        <div class="form-group">
            <label>Klasse *</label>
            <select id="grade" required></select>
        </div>
        
        <div class="form-group">
            <label>Kompetenz *</label>
            <select id="competence" required></select>
        </div>
        
        <div class="form-group">
            <label>Tool</label>
            <input type="text" id="tool" placeholder="z.B. GeoGebra">
        </div>
        
        <div class="form-group">
            <label>Beschreibung</label>
            <textarea id="description" placeholder="Lernziele, Ablauf, Tipps..."></textarea>
        </div>

        <div class="buttons">
            <button type="button" class="cancel" onclick="window.close()">Abbrechen</button>
            <button type="button" class="save" id="saveBtn">Speichern</button>
        </div>
    </div>

    <script>
        const subjects = ["AWT", "Astronomie", "Biologie", "Chemie", "Deutsch", "Englisch", "Französisch", "Geografie", "Geschichte", "Gesellschaftskunde", "Informatik", "Italienisch", "Kunst", "Mathematik", "Musik", "Naturwissenschaften", "Physik", "Plattdeutsch", "Russisch", "Spanisch", "Sozialkunde", "Sport", "Wirtschaft"];
        const grades = Array.from({length: 13}, (_, i) => `Klasse ${i+1}`);
        const competences = [
            "Suchen, Verarbeiten und Aufbewahren",
            "Kommunizieren und Kooperieren",
            "Produzieren und Präsentieren",
            "Schützen und sicher Agieren",
            "Problemlösen und Handeln",
            "Analysieren und Reflektieren"
        ];

        function populate(selectId, options) {
            const s = document.getElementById(selectId);
            options.forEach(v => s.add(new Option(v, v)));
        }

        populate('subject', subjects);
        populate('grade', grades);
        populate('competence', competences);

        document.getElementById('saveBtn').addEventListener('click', () => {
            const r = {
                topic: document.getElementById('topic').value.trim(),
                subject: document.getElementById('subject').value,
                grade: document.getElementById('grade').value,
                competence: document.getElementById('competence').value,
                tool: document.getElementById('tool').value.trim().toLowerCase(),
                description: document.getElementById('description').value.trim(),
                favorite: false,
                lastModified: new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })
            };

            if (!r.topic || !r.subject || !r.grade || !r.competence) {
                alert("Bitte alle Pflichtfelder ausfüllen!");
                return;
            }

            if (window.opener) {
                window.opener.postMessage({
                    action: 'addResource',
                    resource: r
                }, '*');
            }

            alert("Ressource erfolgreich gespeichert!");
            setTimeout(() => window.close(), 300);
        });

        // Dark Mode synchronisieren
        if (window.opener && window.opener.document.body.classList.contains('dark')) {
            document.body.classList.add('dark');
        }
    </script>
</body>
</html>
