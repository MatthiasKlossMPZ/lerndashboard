<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Neue Ressource hinzufügen</title>
<style>

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}
:root { --primary: #6b46c1; --card: #ffffff; --bg: #f5f7fa; --shadow: 0 4px 20px rgba(0,0,0,0.12); }
.dark { --bg: #1a1a1a; --card: #2d2d2d; color: #e0e0e0; }

.container {
    max-width: 680px;
    margin: 10px auto;
    background: var(--card);
    padding: 32px;
    border-radius: 18px;
    box-shadow: var(--shadow);
}
h2 { color: var(--primary); text-align: center; font-size: 23px; font-weight: 700; margin-top: 0; }

.form-group { margin-bottom: 20px; position: relative; }
label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14.8px; }
input, select, textarea {
    width: 100%; padding: 13px; border: 1.8px solid #ccc; border-radius: 12px;
    font-size: 15.5px; box-sizing: border-box;
}
input:focus, select:focus, textarea:focus {
    border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(107,70,193,0.15);
}
textarea { min-height: 110px; resize: vertical; }

.buttons { display: flex; gap: 16px; justify-content: flex-end; margin-top: 32px; }
button {
    padding: 14px 28px; border: none; border-radius: 14px; cursor: pointer;
    font-weight: 700; font-size: 15.5px; min-width: 130px;
}
.cancel { background: #95a5a6; color: white; }
.save { background: var(--primary); color: white; }

.autocomplete-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 1000;
    background: var(--card); border: 1.8px solid var(--primary); border-top: none;
    border-radius: 0 0 12px 12px; max-height: 220px; overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18); display: none;
}
.autocomplete-item {
    padding: 11px 14px; cursor: pointer; border-bottom: 1px solid #eee;
}
.autocomplete-item:hover { background: #eef5ff; }
</style>
</head>
<body>
<div class="container">
    <h2>Neue Ressource hinzufügen</h2>
    <form id="resourceForm" autocomplete="off">
        <div class="form-group">
            <label>Thema *</label>
            <input type="text" id="topic" placeholder="z.B. Klimawandel interaktiv" required>
            <div id="topicDropdown" class="autocomplete-dropdown"></div>
        </div>

        <div class="form-group">
            <label data-label="subject">Fach *</label>
            <select id="subject" required>
                <option value="">– Fach wählen –</option>
            </select>
        </div>

        <div class="form-group">
            <label data-label="grade">Klasse *</label>
            <select id="grade" required></select>
        </div>
        <div class="form-group" id="programGroup" hidden>
            <label data-label="program">Bildungsgang</label>
            <select id="program">
                <option value="">– Bildungsgang wählen –</option>
            </select>
        </div>

        <div class="form-group" id="occupationGroup" hidden>
            <label data-label="occupation">Beruf / Fachrichtung</label>
            <input type="text" id="occupation" placeholder="z. B. Elektroniker/-in, Pflegefachfrau/-mann">
        </div>
        <div class="form-group">
            <label>Kompetenzbereich *</label>
            <select id="competence" required>
                <option value="">– Kompetenz wählen –</option>
                <option>Suchen, Verarbeiten und Aufbewahren</option>
                <option>Kommunizieren und Kooperieren</option>
                <option>Produzieren und Präsentieren</option>
                <option>Schützen und sicher Agieren</option>
                <option>Problemlösen und Handeln</option>
                <option>Analysieren und Reflektieren</option>
            </select>
        </div>

        <div class="form-group">
            <label>Niveaustufe *</label>
            <select id="level" required></select>
        </div>

        <div class="form-group">
            <label>Digitales Tool</label>
            <input type="text" id="tool" placeholder="z.B. GeoGebra, Canva, Anton">
            <div id="toolDropdown" class="autocomplete-dropdown"></div>
        </div>

        <div class="form-group">
            <label>Beschreibung (optional)</label>
            <textarea id="description" placeholder="Kurze Beschreibung der Unterrichtsidee..."></textarea>
        </div>

        <div class="buttons">
            <button type="button" id="cancelBtn" class="cancel">Abbrechen</button>
            <button type="button" id="saveBtn" class="save">Speichern</button>
        </div>
    </form>
</div>

<script type="module" src="src/config/profiles.js"></script>

<script>
const hostDoc = (window.opener || window.parent)?.document;
if (hostDoc && hostDoc !== document &&
    (hostDoc.documentElement.classList.contains('dark') || hostDoc.body.classList.contains('dark'))) {
    document.body.classList.add('dark');
}

function waitForProfiles(cb) {
    if (window.LDProfiles) return cb();
    setTimeout(() => waitForProfiles(cb), 30);
}

function populateFromProfile() {
    const P = window.LDProfiles;
    const profile = P.getActiveProfile();
    P.applyProfileLabels();

    P.fillSelect(document.getElementById('subject'), profile.subjects, `– ${profile.labels.subject} wählen –`);
    P.fillSelect(document.getElementById('grade'), profile.grades, `– ${profile.labels.grade} wählen –`);
    P.fillSelect(document.getElementById('competence'), profile.competences, '– Kompetenz wählen –');

    const programGroup = document.getElementById('programGroup');
    const occupationGroup = document.getElementById('occupationGroup');
    if (programGroup) programGroup.hidden = !profile.showProgram;
    if (occupationGroup) occupationGroup.hidden = !profile.showOccupation;
    if (profile.showProgram) {
        P.fillSelect(document.getElementById('program'), profile.programs, `– ${profile.labels.program} wählen –`);
    }

    const levelSelect = document.getElementById('level');
    const mode = localStorage.getItem('levelMode') || '5';
    const count = parseInt(mode);
    levelSelect.innerHTML = '<option value="">– Niveau wählen –</option>';
    for (let i = 1; i <= count; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `Niveaustufe ${i}`;
        levelSelect.appendChild(opt);
    }
}

waitForProfiles(populateFromProfile);

function getExistingResources() {
    try { return JSON.parse(localStorage.getItem('resources') || '[]'); }
    catch (e) { return []; }
}

function localStamp(date = new Date()) {
    const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 16).replace('T', ' ');
}

document.getElementById('saveBtn').onclick = () => {
    const levelNum = document.getElementById('level').value;
    const now = new Date();

    const resource = {
        topic: document.getElementById('topic').value.trim(),
        subject: document.getElementById('subject').value,
        grade: document.getElementById('grade').value,
        program: document.getElementById('program')?.value || '',
        occupation: document.getElementById('occupation')?.value.trim() || '',
        competence: document.getElementById('competence').value,
        level: levelNum ? `Niveaustufe ${levelNum}` : '',
        tool: document.getElementById('tool').value.trim(),
        description: document.getElementById('description').value.trim(),
        favorite: false,
        created: now.toISOString(),
        lastModified: localStamp(now)
    };

    if (!resource.topic || !resource.subject || !resource.grade || !resource.competence || !resource.level) {
        alert('Bitte alle Pflichtfelder (*) ausfüllen!');
        return;
    }

    checkForSimilarAndDecide(resource);
};

function checkForSimilarAndDecide(resource) {
    const existing = getExistingResources();
    const similarEntries = existing
        .map((r, i) => ({ ...r, originalIndex: i }))
        .filter(r =>
            r.subject === resource.subject &&
            r.grade === resource.grade &&
            (r.tool || '').trim().toLowerCase() === (resource.tool || '').trim().toLowerCase()
        );

    if (similarEntries.length === 0) {
        sendAddResource(resource);
        return;
    }

    const modal = document.createElement('div');
    modal.style.cssText = `
        position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);
        display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;
    `;

    modal.innerHTML = `
        <div style="background:var(--card);border-radius:20px;width:100%;max-width:680px;
                    box-shadow:0 30px 80px rgba(0,0,0,0.45);overflow:hidden;">
            <div style="background:#fff8e1;padding:25px 30px;text-align:center;border-bottom:5px solid #ffb300;">
                <h3 style="margin:0;font-size:24px;color:#d35400;font-weight:700;">
                    ${similarEntries.length} ähnliche Ressource${similarEntries.length > 1 ? 'n' : ''} gefunden
                </h3>
                <p style="margin:8px 0 0;color:#856404;font-size:16.5px;">
                    ${resource.subject} • ${resource.grade} ${resource.tool ? `• ${resource.tool}` : ''}
                </p>
            </div>

            <div style="padding:25px 30px;max-height:55vh;overflow-y:auto;">
                <label style="display:flex;align-items:center;gap:12px;margin-bottom:20px;font-weight:600;font-size:15.5px;">
                    <input type="checkbox" id="selectAll" checked style="width:20px;height:20px;">
                    Alle auswählen
                </label>

                ${similarEntries.map((entry, idx) => `
                    <label style="display:flex;align-items:flex-start;gap:18px;padding:16px;
                                 background:#fdfdfd;border:2px solid #eee;border-radius:14px;
                                 margin-bottom:14px;cursor:pointer;">
                        <input type="checkbox" class="similar-check" data-index="${idx}" checked
                               style="margin-top:4px;width:20px;height:20px;flex-shrink:0;">
                        <div style="flex:1;">
                            <div style="font-weight:700;font-size:16.5px;">${entry.topic}</div>
                            <div style="color:#555;margin-top:4px;">${entry.competence} – ${entry.level}</div>
                        </div>
                    </label>
                `).join('')}
            </div>

            <div style="padding:20px 30px 30px;display:flex;gap:12px;justify-content:flex-end;">
                <button id="modalCancel" style="padding:13px 26px;background:#95a5a6;color:white;border:none;border-radius:12px;font-weight:600;">Abbrechen</button>
                <button id="modalNewOnly" style="padding:13px 26px;background:#27ae60;color:white;border:none;border-radius:12px;font-weight:700;">Nur neu anlegen</button>
                <button id="modalOverride" style="padding:13px 26px;background:#e74c3c;color:white;border:none;border-radius:12px;font-weight:700;">Ausgewählte überschreiben</button>
            </div>
        </div>
    `;

    document.body.appendChild(modal);

    modal.querySelector('#modalCancel').onclick = () => modal.remove();
    modal.querySelector('#modalNewOnly').onclick = () => {
        modal.remove();
        sendAddResource(resource);
    };
    modal.querySelector('#modalOverride').onclick = () => {
        const replaceIndexes = [...modal.querySelectorAll('.similar-check:checked')]
            .map(box => similarEntries[Number(box.dataset.index)]?.originalIndex)
            .filter(index => Number.isInteger(index));

        if (!replaceIndexes.length) {
            alert('Bitte mindestens eine vorhandene Ressource auswählen.');
            return;
        }

        modal.remove();
        sendAddResource(resource, replaceIndexes);
    };
}

function closeForm() {
    if (window.opener) window.close();
    else window.parent.postMessage({ type: 'FORM_CLOSE' }, location.origin);
}

function sendAddResource(resource, replaceIndexes = []) {
    const host = window.opener || window.parent;
    if (!host || host === window) return;

    host.postMessage({
        type: 'SAVE_NEW',
        data: resource,
        replaceIndexes
    }, location.origin);

    const btn = document.getElementById('saveBtn');
    btn.textContent = 'Gespeichert!';
    btn.style.background = '#27ae60';
    setTimeout(closeForm, 800);
}

function setupAutocomplete(inputId, dropdownId, getValues) {
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    if (!input || !dropdown) return;

    input.addEventListener('input', () => {
        const val = input.value.toLowerCase().trim();
        dropdown.innerHTML = '';
        if (!val) { dropdown.style.display = 'none'; return; }

        const suggestions = getValues()
            .filter(s => s.toLowerCase().includes(val))
            .slice(0, 10);

        if (!suggestions.length) { dropdown.style.display = 'none'; return; }

        suggestions.forEach(s => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item';
            div.textContent = s;
            div.onclick = () => { input.value = s; dropdown.style.display = 'none'; };
            dropdown.appendChild(div);
        });
        dropdown.style.display = 'block';
    });

    document.addEventListener('click', e => {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) dropdown.style.display = 'none';
    });
}

setupAutocomplete('topic', 'topicDropdown', () =>
    [...new Set(getExistingResources().map(r => r.topic).filter(Boolean))].sort()
);
setupAutocomplete('tool', 'toolDropdown', () =>
    [...new Set(getExistingResources().map(r => r.tool).filter(Boolean))].sort()
);

document.getElementById('cancelBtn').onclick = closeForm;
document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('saveBtn').click();
    }
    if (e.key === 'Escape') closeForm();
});
</script>
</body>
</html>
