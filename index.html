/* ==================== LÖSCH-CONFIRM-DIALOG ==================== */
dialog#confirmDeleteDialog {
    border: none;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    padding: 32px 28px;
    max-width: 420px;
    width: 90vw;
    background: var(--card);
    animation: modalPop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;

    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    margin: 0 !important;                    
    z-index: 30000 !important;
}

dialog#confirmDeleteDialog::backdrop {
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
}

@media (max-width: 768px) {
    dialog#confirmDeleteDialog {
        width: 94vw !important;
        padding: 28px 20px !important;
        max-width: none !important;
    }
}

dialog#confirmDeleteDialog p {
    margin: 0 0 28px;
    font-size: 16.5px;
    line-height: 1.55;
    color: var(--text);
}

dialog#confirmDeleteDialog .buttons {
    display: flex;
    gap: 14px;
    justify-content: flex-end;
    margin-top: 12px;
}

dialog#confirmDeleteDialog button {
    padding: 11px 22px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    min-width: 100px;
    transition: all 0.2s;
}

dialog#confirmDeleteDialog button[value="cancel"] {
    background: #95a5a6;
    color: white;
}

dialog#confirmDeleteDialog button[value="delete"] {
    background: var(--danger);
    color: white;
}

dialog#confirmDeleteDialog button[value="delete"]:hover {
    background: #c0392b;
    transform: translateY(-2px);
}

@keyframes modalPop {
    from { 
        transform: translate(-50%, -50%) scale(0.75); 
        opacity: 0; 
    }
    to { 
        transform: translate(-50%, -50%) scale(1); 
        opacity: 1; 
    }
}

.filter-container {
    overflow: visible !important; 
}

/* ==================== FLOATING HELP BUTTON – UNTEN RECHTS ==================== */
.floating-help-btn {
    position: fixed;
    bottom: 24px;           
    right: 24px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--primary);
    color: white;

}

.floating-help-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 30px rgba(107, 70, 193, 0.5);
    background: #5a37a8;
}

/* Tooltip */
.floating-help-btn::after {
    content: "Bedienungsanleitung";
    position: absolute;
    right: 72px;
    bottom: 50%;
    transform: translateY(50%);
    background: #2c3e50;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: all 0.25s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    z-index: 9991;
}

.floating-help-btn:hover::after {
    opacity: 1;
    visibility: visible;
    right: 78px;
}

/* ACTION ICONS - Hover Fix */
.action-icon {
    width: 34px;
    height: 34px;
    transition: all 0.2s ease;
    transform: scale(1);

.action-icon:hover {

}

/* ==================== AKTIVER FILTER STYLING ==================== */
.filter-container.active {
    background: linear-gradient(135deg, #fff5f5, #ffeaea) !important;
    box-shadow: 0 2px 12px rgba(255, 80, 80, 0.18) !important;
    border: 2px solid #ff6b6b !important;
}

/* Kein roter Strich links */
.filter-container.active::before {
    display: none !important;
}

/* === NUR bei aktivem Filter: Export-Buttons rot umrandet === */
.filter-container.active ~ .export-buttons .btn,
.filter-container.active ~ .export-buttons button,
.export-buttons .btn.filter-active,
.export-buttons button.filter-active {
    border: 2px solid #ff6b6b !important;
    box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3) !important;
}

/* Hover-Effekt nur bei aktivem Filter */
.filter-container.active ~ .export-buttons .btn:hover,
.filter-container.active ~ .export-buttons button:hover {
    border-color: #e63939 !important;
    transform: translateY(-2px);
}
